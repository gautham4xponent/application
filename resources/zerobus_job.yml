resources:
  jobs:
    ZeroBus_Ingestion:
      name: ZeroBus_Ingestion
      tasks:
        - task_key: create_table
          notebook_task:
            notebook_path: /Workspace/Users/lakshmi.reddy@xponent.ai/create_zerobus_table
            source: WORKSPACE
        - task_key: run_zerobus
          depends_on:
            - task_key: create_table
          notebook_task:
            notebook_path: /Workspace/Users/lakshmi.reddy@xponent.ai/run_zerobus
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: sandbox
        - name: schema
          default: lakshmi
        - name: server_endpoint
          default: https://4206962778623078.zerobus.eastus.azuredatabricks.net
        - name: table
          default: zerobus_device_data
        - name: total_records
          default: "1000000"
        - name: batch_size
          default: "100000"
      performance_target: PERFORMANCE_OPTIMIZED
